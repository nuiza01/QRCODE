name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --engine-strict

      - name: Runtime versions
        run: node --version && npm --version

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Offline migration drift (no DATABASE_URL or dotenv)
        run: env -u DATABASE_URL npm run check:drift

      # No DATABASE_URL here on purpose: the build must not require a database,
      # which is why env parsing is lazy (see src/lib/env.ts). This is a
      # Turbopack smoke build only; release admission remains a separate gate.
      - name: Turbopack build smoke
        run: env -u DATABASE_URL -u NEXT_PUBLIC_APP_URL -u VERCEL_PROJECT_PRODUCTION_URL npx next build

      - name: Upload Turbopack artifact for independent review
        uses: actions/upload-artifact@v4
        with:
          name: turbopack-next-artifact-${{ github.sha }}
          path: .next
          if-no-files-found: error
          retention-days: 7

  # Separate clean checkout: no cached .next and never publish this synthetic
  # artifact. This verifies admission + emitted URLs, not permission to deploy.
  release-artifact:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: https://origin-fixture.nqr-ci.com
      VERCEL_PROJECT_PRODUCTION_URL: fallback-fixture.nqr-ci.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --engine-strict
      - name: Production build admission and 22-page origin verification
        run: npm run build:release
